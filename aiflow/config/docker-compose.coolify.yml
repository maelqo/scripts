# Same as docker-compose.prod.yml, but with no host port bindings. Use this
# one (not docker-compose.prod.yml) when pasting AiFlow into Coolify as a
# "Docker Compose" resource.
#
# Coolify runs its own reverse proxy (Traefik/Caddy under the hood) and
# expects to reach a service over the internal Docker network, attaching a
# Domain to it in its own UI rather than a host `ports:` mapping. A compose
# resource that declares `ports:` anyway fights that model: Coolify tries to
# bind those host ports directly, which on this same host collides with
# Coolify's own dashboard on :8000 ("port is already allocated"). `expose:`
# (no host binding, container-to-container only) is the correct shape here,
# the same one docker-compose.caddy.yml already uses for the same reason in
# front of a self-hosted Caddy instead of Coolify.
services:
  backend:
    image: ghcr.io/maelqo/aiflow-backend:${AIFLOW_VERSION:-7}
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    expose:
      - "8000"
    volumes:
      - aiflow_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin:
    image: ghcr.io/maelqo/aiflow-admin:${AIFLOW_VERSION:-7}
    environment:
      # Read at container start, not baked into the JS bundle; this is
      # what lets the same published image work for every client without a
      # rebuild. See admin/docker-entrypoint.sh.
      API_BASE: ${PUBLIC_BASE_URL}
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  aiflow_data:
