# This variant has no host port bindings, meant for pasting straight into
# Coolify as a "Docker Compose" resource.
#
# Coolify runs its own reverse proxy and expects to reach a service over the
# internal Docker network, attaching a domain to it in its own UI instead of
# through a host `ports:` mapping. A compose resource that declares `ports:`
# anyway fights that model: Coolify tries to bind those host ports directly,
# which on this same host collides with Coolify's own dashboard on `8000`
# (it fails with "port is already allocated"). `expose:`, with no host
# binding and container-to-container only, is the right shape here.
services:
  backend:
    image: ghcr.io/maelqo/aiflow-backend:${AIFLOW_VERSION:-8}
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    expose:
      - "8000"
    volumes:
      - aiflow_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin:
    image: ghcr.io/maelqo/aiflow-admin:${AIFLOW_VERSION:-8}
    environment:
      # This is read at container start rather than baked into the JS bundle,
      # which is what lets one published image serve every client without a rebuild.
      API_BASE: ${PUBLIC_BASE_URL}
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  aiflow_data:
