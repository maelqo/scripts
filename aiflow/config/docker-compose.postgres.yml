# This is an optional overlay that swaps SQLite, the shipped default, for
# Postgres, for clients whose own backup or HA tooling is built around it. It
# just wires up a Postgres service and points the backend at it, so combine
# it with one of the other compose files rather than running it alone. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.caddy.yml -f docker-compose.postgres.yml up -d
#
# Set `POSTGRES_USER`, `POSTGRES_PASSWORD`, and `POSTGRES_DB` in `.env` (the
# defaults below are fine to try, change them for anything real).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiflow}
      POSTGRES_DB: ${POSTGRES_DB:-aiflow}
    volumes:
      - aiflow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiflow} -d ${POSTGRES_DB:-aiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiflow}:${POSTGRES_PASSWORD:-aiflow}@postgres:5432/${POSTGRES_DB:-aiflow}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aiflow_postgres_data:
