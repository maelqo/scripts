# This overlay puts a Caddy reverse proxy in front of the backend and admin
# services, issuing and renewing Let's Encrypt certificates automatically.
# Use it on a bare VPS with no reverse proxy of its own. It's not needed
# behind a PaaS that already terminates TLS for you.
#
# `backend` and `admin` are deliberately not published on host ports here.
# Only Caddy is publicly reachable, on `80` and `443`, and it reaches
# `backend` and `admin` over the internal Compose network instead.
services:
  backend:
    image: ghcr.io/maelqo/aiflow-backend:${AIFLOW_VERSION:-7}
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    expose:
      - "8000"
    volumes:
      - aiflow_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin:
    image: ghcr.io/maelqo/aiflow-admin:${AIFLOW_VERSION:-7}
    environment:
      API_BASE: ${PUBLIC_BASE_URL}
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend
      - admin
    restart: unless-stopped

volumes:
  aiflow_data:
  caddy_data:
