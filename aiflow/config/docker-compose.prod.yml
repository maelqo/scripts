# This is the client deployment compose file: it pulls versioned, pre-built
# images from GitHub Container Registry instead of building from source locally.
#
# Pin the tag to match your own change-control comfort level via
# `AIFLOW_VERSION` in `.env`. `8` tracks every `8.x` release, `8.0` tracks
# patch releases within `8.0` only, and an exact `8.0.0` never moves until
# you bump it yourself.
services:
  backend:
    image: ghcr.io/maelqo/aiflow-backend:${AIFLOW_VERSION:-8}
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - aiflow_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin:
    image: ghcr.io/maelqo/aiflow-admin:${AIFLOW_VERSION:-8}
    environment:
      # This is read at container start rather than baked into the JS bundle,
      # which is what lets one published image serve every client without a rebuild.
      API_BASE: ${PUBLIC_BASE_URL}
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  aiflow_data:
